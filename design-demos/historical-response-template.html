<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>历史人物案例 — 真实回复排版复刻</title>
<style>
  *{box-sizing:border-box}html,body{margin:0;width:1440px;height:1080px;overflow:hidden}
  body{background:#f2f1ed;color:#20211d;font-family:"Microsoft YaHei","Noto Sans SC",sans-serif}
  .top{height:58px;background:#fff;border-bottom:1px solid #deddd7;display:flex;align-items:center;justify-content:space-between;padding:0 42px;color:#676962;font-size:14px}
  .top strong{color:#20211d}.badge{border:1px solid #b8b9b3;border-radius:99px;padding:7px 12px;font-size:12px;letter-spacing:.08em}
  .wrap{width:1040px;margin:31px auto 0}.user{margin-left:auto;width:max-content;max-width:850px;background:#e2e2dd;border-radius:18px 18px 4px 18px;padding:15px 20px;font-size:16px;line-height:1.65}
  .assistant{margin-top:22px;background:#fff;border:1px solid #deddd7;border-radius:8px;padding:27px 38px 34px;box-shadow:0 8px 28px rgba(30,31,27,.04)}
  .meta{display:flex;justify-content:space-between;font-size:12px;letter-spacing:.1em;color:#777971;margin-bottom:16px;text-transform:uppercase}.meta b{color:#7b3023}.name{font-family:"Noto Serif SC","Microsoft YaHei",serif;color:#20211d;font-weight:700}
  p{font-size:16px;line-height:1.68;margin:0 0 15px;text-wrap:pretty}h2{font-family:"Noto Serif SC","Microsoft YaHei",serif;font-size:23px;margin:21px 0 12px;padding-top:17px;border-top:1px solid #e3e2dc}
  table{width:100%;border-collapse:collapse;margin:9px 0 17px;font-size:14px}th,td{border:1px solid #d7d6cf;padding:9px 12px;text-align:left}th{background:#f3f1eb}.pillars{font-size:18px;font-weight:700;letter-spacing:.07em}
  blockquote{margin:12px 0 0;border-left:3px solid #7b3023;padding:4px 0 4px 18px;font-family:"Noto Serif SC","Microsoft YaHei",serif;font-size:18px;line-height:1.62;font-weight:700}
  .fade{position:absolute;left:0;right:0;bottom:0;height:128px;background:linear-gradient(transparent,#f2f1ed 88%)}.continue{position:absolute;left:50%;bottom:25px;transform:translateX(-50%);background:#20211d;color:#fff;padding:11px 19px;border-radius:99px;font-size:13px;letter-spacing:.04em}
</style>
</head>
<body>
  <div class="top"><strong>历史人物公开案例</strong><span class="badge">真实回复 · 排版复刻</span></div>
  <main class="wrap">
    <div class="user" id="prompt"></div>
    <article class="assistant">
      <div class="meta"><span><b>BAZI SKILL</b> · RESPONSE</span><span class="name" id="name"></span></div>
      <p id="intro"></p>
      <h2>一、命盘与口径</h2>
      <table><thead><tr><th>四柱</th><th>天干十神</th><th>地支藏干</th></tr></thead><tbody id="rows"></tbody></table>
      <p class="pillars" id="pillars"></p>
      <p id="convention"></p>
      <h2>二、命局总纲</h2>
      <blockquote id="thesis"></blockquote>
    </article>
  </main>
  <div class="fade"></div><div class="continue">点击图片，阅读完整聊天记录</div>
<script>
const cases = {
  puyi: {
    name:'溥仪',
    prompt:'溥仪，男，1906-02-07，午时（约11:00—13:00），北京什刹海醇亲王府',
    intro:'按你提供的“午时”排盘，溥仪的主盘是：',
    rows:[['年柱：丙午','偏财','丁正财、己正官'],['月柱：庚寅','偏印','甲食神、丙偏财、戊七杀'],['日柱：壬午','日主','丁正财、己正官'],['时柱：丙午','偏财','丁正财、己正官']],
    pillars:'乾造：丙午　庚寅　壬午　丙午',
    convention:'1906年2月7日已经过立春，因此为丙午年、庚寅月。以下把“午时”视为传统时辰信息，以午时中点12:00计算；若记录指现代钟表时间，早段可能跨入巳时。',
    thesis:'外部给予的身份、资源与责任极重，主体自身的承载和自主性却很弱。名位先于能力，环境长期大于个人。'
  },
  einstein: {
    name:'阿尔伯特·爱因斯坦',
    prompt:'阿尔伯特·爱因斯坦，男，1879-03-14，11:30，德国乌尔姆，帮我算一下',
    intro:'算出来了。按项目内置历法计算器，爱因斯坦的四柱是：',
    rows:[['年柱：己卯','伤官','乙·正印'],['月柱：丁卯','劫财','乙·正印'],['日柱：丙申','日主','庚·偏财、壬·七杀、戊·食神'],['时柱：甲午','偏印','丁·劫财、己·伤官']],
    pillars:'八字：己卯　丁卯　丙申　甲午　｜　日主：丙火',
    convention:'按乌尔姆约东经10°、当地地方时近似校正，记录时间11:30约为真太阳时11:20；即使按现代中欧时间校正也仍属于午时，所以四柱不变。',
    thesis:'印旺身强、伤官透出、财杀藏于日支。木火构成强烈的抽象认知与自我驱动力，但需要土、金、水把内部思想转化为可验证、可传播的现实成果。'
  },
  churchill: {
    name:'温斯顿·丘吉尔',
    prompt:'温斯顿·丘吉尔，男，1874-11-30，01:30，英国牛津郡伍德斯托克布莱尼姆宫',
    intro:'按传统子平八字作完整排盘如下。',
    rows:[['年柱：甲戌','正财','戊正印、辛比肩、丁七杀'],['月柱：乙亥','偏财','壬伤官、甲正财'],['日柱：辛卯','日主','乙偏财'],['时柱：己丑','偏印','己偏印、癸食神、辛比肩']],
    pillars:'八字：甲戌　乙亥　辛卯　己丑　｜　日主：辛金',
    convention:'布莱尼姆宫约位于西经1°21′，按GMT 01:30加经度及时间方程近似校正，真太阳时约为01:35，仍属丑时；即使理解为地方平时，也不会跨出丑时。',
    thesis:'财旺身偏弱，寒湿偏重；以土金建立承载，以火调候、立威。'
  }
};
const key=new URLSearchParams(location.search).get('case') || 'puyi';
const data=cases[key] || cases.puyi;
document.getElementById('prompt').textContent=data.prompt;
document.getElementById('name').textContent=data.name;
document.getElementById('intro').textContent=data.intro;
document.getElementById('pillars').textContent=data.pillars;
document.getElementById('convention').textContent=data.convention;
document.getElementById('thesis').textContent=data.thesis;
document.getElementById('rows').innerHTML=data.rows.map(row=>`<tr>${row.map(cell=>`<td>${cell}</td>`).join('')}</tr>`).join('');
</script>
</body>
</html>
