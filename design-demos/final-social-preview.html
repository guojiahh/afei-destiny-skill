<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bazi Skill — Social Preview</title>
<style>
  *{box-sizing:border-box} html,body{margin:0;width:1280px;height:640px;overflow:hidden}
  body{background:#e9e3d7;color:#171713;font-family:"Noto Serif SC","Source Han Serif SC","Microsoft YaHei",serif}
  .page{position:relative;width:100%;height:100%;padding:46px 58px 42px;background:linear-gradient(105deg,rgba(255,255,255,.32),transparent 44%),#e9e3d7}
  .page:after{content:"";position:absolute;inset:18px;border:1px solid rgba(23,23,19,.25);pointer-events:none}
  header{display:flex;justify-content:space-between;align-items:center;font:600 13px/1.2 Arial,sans-serif;letter-spacing:.18em;text-transform:uppercase;border-bottom:1px solid #27271f;padding-bottom:16px}
  .owner{letter-spacing:.06em;text-transform:none}
  main{display:grid;grid-template-columns:1.18fr .82fr;gap:60px;padding-top:39px}
  .eyebrow{font:700 13px/1 Arial,sans-serif;letter-spacing:.2em;color:#7a2f21;margin-bottom:18px}
  h1{font-size:102px;line-height:.95;letter-spacing:.02em;margin:0 0 24px;font-weight:700}
  .tagline{font-size:26px;line-height:1.5;margin:0;max-width:650px}
  .modules{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid #27271f;border-left:1px solid #27271f}
  .module{min-height:123px;padding:18px;border-right:1px solid #27271f;border-bottom:1px solid #27271f}
  .module b{display:block;font-size:32px;color:#7a2f21;margin-bottom:8px}
  .module span{font:600 15px/1.4 Arial,"Microsoft YaHei",sans-serif;letter-spacing:.06em}
  footer{position:absolute;left:58px;right:58px;bottom:42px;display:flex;justify-content:space-between;align-items:end;border-top:1px solid #27271f;padding-top:16px}
  .promise{font-size:18px;letter-spacing:.08em}.url{font:600 15px/1 Arial,sans-serif;letter-spacing:.05em}
</style>
</head>
<body>
<section class="page">
  <header><span>BAZI SKILL · CODEX</span><span class="owner">github.com/guojiahh</span></header>
  <main>
    <div>
      <div class="eyebrow">DETERMINISTIC CHART · EVIDENCE-FIRST REASONING</div>
      <h1>八字研判</h1>
      <p class="tagline">确定性排盘 · 证据化判断 · 有边界的表达</p>
    </div>
    <div class="modules">
      <div class="module"><b>算</b><span>确定性排盘</span></div>
      <div class="module"><b>析</b><span>结构化研判</span></div>
      <div class="module"><b>证</b><span>反证与校准</span></div>
      <div class="module"><b>界</b><span>现实边界</span></div>
    </div>
  </main>
  <footer><span class="promise">让命盘可计算，让判断有来处。</span><span class="url">OPEN SOURCE · MIT LICENSE</span></footer>
</section>
</body>
</html>
