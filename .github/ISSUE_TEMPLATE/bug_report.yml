name: 问题反馈
description: 报告计算、安装或 HTML 交互异常。
title: "[问题] "
body:
  - type: markdown
    attributes:
      value: |
        Issue 是公开的。请使用合成数据复现，不要贴真实出生资料、私人咨询内容、咨询目录或含答案的题库缓存；截图和日志请先脱敏。
  - type: dropdown
    id: area
    attributes:
      label: 问题范围
      options:
        - 历法计算与口径
        - Skill 安装与调用
        - HTML 报告与交互
        - 其他
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 运行环境
      description: 写明系统、项目版本或提交；按需补充 Python、Node.js、浏览器及 Codex 版本。
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 怎样复现
      description: 提供最少步骤、运行命令或合成输入；计算问题请说明时区、真太阳时和换日口径。
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: 预期与实际结果
      description: 说明原本期待什么、实际发生什么；可附已脱敏的报错或截图。
    validations:
      required: true
