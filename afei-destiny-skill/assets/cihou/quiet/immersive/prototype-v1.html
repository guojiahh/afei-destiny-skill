<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>此后 · 主图交互原型</title>
<style>
:root{color-scheme:light;font-family:"Songti SC","Noto Serif CJK SC","STSong",serif;background:#eceee3;color:#3c473d}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{background:radial-gradient(ellipse at 42% 36%,#f4f2e6 0%,#e9ecdf 60%,#dfe5d7 100%)}
#world{position:fixed;inset:0;touch-action:none;user-select:none;cursor:default}
#world:after{content:"";position:absolute;inset:0;pointer-events:none;opacity:.10;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 220 220' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.72' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Cpath fill='%235e6c52' opacity='.65' filter='url(%23n)' d='M0 0h220v220H0z'/%3E%3C/svg%3E")}
#instruction{position:fixed;left:50%;bottom:max(7.5vh,28px);transform:translateX(-50%);display:flex;align-items:center;gap:13px;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity 1.1s ease;color:#58624f;font-size:13px;letter-spacing:.12em;font-weight:400}
#instruction.visible{opacity:.9}.mark{position:relative;width:24px;height:24px}.mark:before{content:"";position:absolute;inset:2px;border:1px solid #76816c;border-radius:50%;opacity:.5}.mark svg{position:absolute;inset:0;transform:rotate(-90deg)}.mark circle{stroke:#465340;stroke-width:1;fill:none;stroke-dasharray:63;stroke-dashoffset:63;transition:stroke-dashoffset 100ms linear}
#exit,#again{position:fixed;left:50%;bottom:max(7.5vh,28px);transform:translateX(-50%);color:#43503e;border:0;background:none;font:inherit;font-size:14px;letter-spacing:.13em;padding:12px 8px;cursor:pointer;opacity:0;pointer-events:none;transition:opacity .9s ease}#exit.visible,#again.visible{opacity:1;pointer-events:auto}button:after{content:"";display:block;height:1px;width:24px;background:currentColor;opacity:.4;margin:10px auto 0;transition:width .5s}button:hover:after{width:100%}button:focus-visible{outline:1px solid #727e62;outline-offset:8px}
#thought{position:fixed;left:50%;top:13vh;transform:translateX(-50%);margin:0;color:#4e5948;font-size:clamp(18px,1.55vw,24px);font-weight:400;letter-spacing:.1em;white-space:nowrap;opacity:0;transition:opacity 1.4s ease}#thought.visible{opacity:1}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="world" aria-label="一位女孩正在一条纸质道路上行走。按住画面，让视线慢慢走远。"></div>
<p id="thought" aria-live="polite"></p>
<div id="instruction"><span class="mark"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/></svg></span><span>按住，让视线走远一点</span></div>
<button id="exit" type="button">向前，再走一步</button>
<button id="again" type="button">再走一次</button>
<script src="three.min.js"></script>
<script src="hero-scene.js"></script>
<script>
(function(){
'use strict';
var world=document.getElementById('world'),hint=document.getElementById('instruction'),arc=hint.querySelector('circle'),thought=document.getElementById('thought'),exit=document.getElementById('exit'),again=document.getElementById('again');
var scene=window.heroScene=new CihouHeroScene(world,{spriteUrl:'girl-walk-v1.png',spriteFrames:8,spriteColumns:4,spriteRows:2,spriteFps:8});
var held=false,progress=0,last=0,exitStart=0,complete=false,reached=false,startTime=performance.now();
var query=new URLSearchParams(location.search);if(query.has('progress')){progress=Math.max(0,Math.min(1,Number(query.get('progress'))));scene.progress=scene.targetProgress=progress;}
function say(text){thought.classList.remove('visible');setTimeout(function(){thought.textContent=text;thought.classList.add('visible')},200);}
function press(event){if(event.button!==undefined&&event.button!==0)return;if(complete||reached||performance.now()-startTime<1800)return;held=true;hint.classList.remove('visible');world.setPointerCapture(event.pointerId);thought.classList.remove('visible');}
function release(){held=false;if(!reached&&!complete&&performance.now()-startTime>1800)hint.classList.add('visible');}
world.addEventListener('pointerdown',press);world.addEventListener('pointerup',release);world.addEventListener('pointercancel',release);world.addEventListener('lostpointercapture',release);
exit.addEventListener('click',function(){if(complete)return;complete=true;exit.classList.remove('visible');thought.classList.remove('visible');exitStart=performance.now();});
again.addEventListener('click',function(){location.reload()});
world.tabIndex=0;world.addEventListener('keydown',function(event){if(event.code==='Space'&&!event.repeat){event.preventDefault();if(!reached){held=true;hint.classList.remove('visible')}}});world.addEventListener('keyup',function(event){if(event.code==='Space'){event.preventDefault();release()}});
setTimeout(function(){if(!reached)hint.classList.add('visible')},2200);
function update(now){var dt=last?Math.min(.05,(now-last)/1000):0;last=now;if(held&&!reached){progress=Math.min(1,progress+dt/7.4);scene.setProgress(progress);arc.style.strokeDashoffset=String(63*(1-progress));if(progress===1){reached=true;held=false;hint.classList.remove('visible');setTimeout(function(){say('原来，眼前的路不止一面。');exit.classList.add('visible')},1400)}}if(exitStart){var e=Math.min(1,(now-exitStart)/6500);scene.setExit(e);if(e===1){exitStart=0;setTimeout(function(){say('下一步，可以由你选择。');again.classList.add('visible')},600)}}requestAnimationFrame(update)}requestAnimationFrame(update);
})();
</script>
</body>
</html>
