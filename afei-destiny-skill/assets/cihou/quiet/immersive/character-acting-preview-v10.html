<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>V10 角色表演检查</title><style>
*{box-sizing:border-box}body{margin:0;background:#eee8d9;color:#405879;font:13px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}#stage{height:76svh;min-height:430px}canvas{display:block;width:100%;height:100%}.controls{max-width:1140px;margin:0 auto;padding:12px 24px 24px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}button{font:inherit;color:inherit;background:none;border:1px solid #b9bbae;padding:7px 12px;cursor:pointer}button[aria-pressed=true]{background:#405879;color:#eee8d9}label{display:flex;gap:9px;align-items:center}output{min-width:180px}.note{font-size:11px;opacity:.75;width:100%;margin:0}input{accent-color:#405879}#seek{width:220px}
</style></head><body><div id="stage" aria-label="V10 人物表演预览"></div><div class="controls">
<button data-action="walk" aria-pressed="true">轻走</button><button data-action="purpose">向前走</button><button data-action="impulse">短按回应</button><button data-action="pick">采花</button><button data-action="reconsider">再次遇见</button><button data-action="place">置花</button><button data-action="cross">跨路</button><button data-action="sequence">全表演</button><button id="pause">暂停</button><label><input id="debug" type="checkbox">真实触点</label><label>进度<input id="seek" type="range" min="0" max="1" step=".01" value="0"></label><output id="status">轻走</output><p class="note">表演检查页；并非主图成品。花从原处→手→包口→手→地始终只有一朵。跨路时深蓝块是旧路、灰蓝块是新路，鞋底触点和承重影随实际动作变化。</p></div>
<script src="three.min.js"></script><script src="hero-character-rig-v10.js"></script><script>
(async function(){'use strict';var T=THREE,stage=document.getElementById('stage'),renderer=new T.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setClearColor('#eee8d9',1);renderer.outputColorSpace=T.SRGBColorSpace;stage.appendChild(renderer.domElement);var scene=new T.Scene(),camera=new T.OrthographicCamera(-1,1,.6,-.6,.01,20);camera.position.set(0,.4,5);camera.lookAt(0,.4,0);var meta=await fetch('girl-rig-parts-v5.json').then(function(r){return r.json();}),rig=await CihouCharacterRigV10.create({atlasUrl:'girl-rig-parts-v5.png',metadata:meta,height:.8});scene.add(rig.group);
var road=new T.Mesh(new T.PlaneGeometry(2,.4),new T.MeshBasicMaterial({color:'#506983'}));road.position.set(-.9,-.19,-.03);scene.add(road);var newRoad=new T.Mesh(new T.PlaneGeometry(2,.4),new T.MeshBasicMaterial({color:'#a7b2ba'}));newRoad.position.set(1.1,-.19,-.03);scene.add(newRoad);var floor=new T.Line(new T.BufferGeometry().setFromPoints([new T.Vector3(-2,0,.001),new T.Vector3(2,0,.001)]),new T.LineBasicMaterial({color:'#c4baa2'}));scene.add(floor);
function dot(r,color){var mesh=new T.Mesh(new T.CircleGeometry(r,24),new T.MeshBasicMaterial({color:color,transparent:true,depthWrite:false}));mesh.position.z=.12;mesh.renderOrder=90;scene.add(mesh);return mesh;}var handDot=dot(.007,'#d5aa52'),bagDot=dot(.006,'#eee8d9'),footDots=[dot(.016,'#24374b'),dot(.016,'#24374b')];
var previewFlower=rig.flowerMesh.clone();previewFlower.visible=true;scene.add(previewFlower);var flowerAt=new T.Vector3(.8*.245,.8*.50,.025),groundAt=new T.Vector3(.8*.22,.8*.14,.025),stem=new T.Line(new T.BufferGeometry().setFromPoints([new T.Vector3(flowerAt.x,0,.025),flowerAt]),new T.LineBasicMaterial({color:'#514f3e'}));scene.add(stem);
var paused=false,mode='walk',time=0,gait=0,last=0,seek=document.getElementById('seek'),status=document.getElementById('status'),debug=document.getElementById('debug'),duration={pick:5.8,reconsider:4.8,place:5.2,cross:5.5,impulse:1.2,walk:1,purpose:1,sequence:23};
function current(){if(mode==='sequence'){if(time<5.8)return{action:'pick',p:time/5.8};if(time<7.5)return{action:'walk',p:(time-5.8)/1.7,hasFlower:true};if(time<12.3)return{action:'reconsider',p:(time-7.5)/4.8};if(time<17.5)return{action:'place',p:(time-12.3)/5.2};return{action:'cross',p:(time-17.5)/5.5};}return{action:mode,p:Math.min(1,time/(duration[mode]||1))};}
function draw(){var c=current(),event={action:c.action,progress:c.p,hasFlower:c.hasFlower||c.action==='reconsider'||c.action==='place',renderFlower:false,flowerTarget:(c.action==='place'||c.action==='cross')?[groundAt.x,groundAt.y]:[flowerAt.x,flowerAt.y]},speed=0;if(c.action==='walk'||c.action==='purpose'){event={intent:c.action==='purpose'?1:0,hasFlower:c.hasFlower,renderFlower:false};speed=1;}if(c.action==='impulse')event={impulse:c.p,lockFeet:1,renderFlower:false};rig.update(gait,speed,event);var state=rig.getActionState();rig.group.position.x=state.rootTravel||0;var hand=rig.getAttachment('hand').add(rig.group.position),bag=rig.getAttachment('bag').add(rig.group.position);handDot.position.copy(hand);bagDot.position.copy(bag);handDot.visible=bagDot.visible=debug.checked;
var owner=state.flowerOwnership;if(owner==='stem')previewFlower.position.copy(flowerAt);else if(owner==='ground')previewFlower.position.copy(groundAt);else previewFlower.position.copy(rig.getAttachment('flower').add(rig.group.position));previewFlower.rotation.z=owner==='bag'?-.20:.12;stem.visible=owner==='stem';
rig.getFootContacts().forEach(function(foot,i){var d=footDots[i];d.visible=foot.stance>.01||debug.checked;d.position.set(foot.x+rig.group.position.x,foot.y-.001,.08);d.scale.set(1+foot.stance*.2,.22,.1);d.material.opacity=debug.checked?.65:.30*foot.stance;});renderer.render(scene,camera);status.textContent=c.action+' '+c.p.toFixed(2)+' · '+(state.phase||'walk')+' · '+owner+(debug.checked?' · hand '+hand.x.toFixed(3)+','+hand.y.toFixed(3)+' · bag '+bag.x.toFixed(3)+','+bag.y.toFixed(3):'');seek.value=String(c.p);}
function resize(){var w=stage.clientWidth,h=stage.clientHeight;renderer.setSize(w,h,false);var span=new URLSearchParams(location.search).get('size')==='small'?3.90:2.60;camera.left=-span*.5*w/h;camera.right=span*.5*w/h;camera.top=span*.5;camera.bottom=-span*.5;camera.updateProjectionMatrix();draw();}new ResizeObserver(resize).observe(stage);document.querySelectorAll('[data-action]').forEach(function(b){b.onclick=function(){mode=b.dataset.action;time=0;gait=0;paused=mode!=='walk'&&mode!=='purpose'&&mode!=='sequence';document.getElementById('pause').textContent=paused?'继续':'暂停';document.querySelectorAll('[data-action]').forEach(function(x){x.setAttribute('aria-pressed',String(x===b));});draw();};});document.getElementById('pause').onclick=function(){paused=!paused;this.textContent=paused?'继续':'暂停';};seek.oninput=function(){time=Number(this.value)*(duration[mode]||1);gait=Number(this.value)/.92;paused=true;document.getElementById('pause').textContent='继续';draw();};debug.onchange=draw;resize();function tick(now){var dt=last?Math.min(.05,(now-last)/1000):0;last=now;if(!paused){time+=dt;gait+=dt;if(time>(duration[mode]||1)&&mode!=='walk'&&mode!=='purpose'){time=duration[mode]||1;paused=true;document.getElementById('pause').textContent='继续';}}draw();requestAnimationFrame(tick);}requestAnimationFrame(tick);
})();</script></body></html>
