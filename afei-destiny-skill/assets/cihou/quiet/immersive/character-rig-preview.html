(async function(){'use strict';const T=THREE,stage=document.getElementById('stage'),renderer=new T.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setClearColor('#f1eade',1);renderer.outputColorSpace=T.SRGBColorSpace;stage.appendChild(renderer.domElement);const scene=new T.Scene(),camera=new T.OrthographicCamera(-.9,.9,.9,-.1,.01,20);camera.position.set(0,.4,5);camera.lookAt(0,.4,0);const rig=window.rig=await CihouCharacterRig.create({atlasUrl:'girl-rig-parts-v4.png',metadata:JSON.parse(document.getElementById('rig-meta').textContent),height:.8});scene.add(rig.group);const line=new T.Line(new T.BufferGeometry().setFromPoints([new T.Vector3(-1.5,0,-.01),new T.Vector3(1.5,0,-.01)]),new T.LineBasicMaterial({color:'#b9bcad'}));scene.add(line);const dots=[];for(let i=0;i<2;i++){const dot=new T.Mesh(new T.CircleGeometry(.009,16),new T.MeshBasicMaterial({color:i?'#ad4f37':'#405879'}));dot.position.z=.1;scene.add(dot);dots.push(dot)}let time=0,last=0,paused=false;const speed=document.getElementById('speed'),debug=document.getElementById('debug');function resize(){const w=stage.clientWidth,h=stage.clientHeight;renderer.setSize(w,h,false);camera.left=-.55*w/h;camera.right=.55*w/h;camera.top=.55;camera.bottom=-.55;camera.updateProjectionMatrix()}new ResizeObserver(resize).observe(stage);resize();document.getElementById('pause').onclick=function(){paused=!paused;this.textContent=paused?'继续':'暂停'};document.getElementById('step').onclick=function(){paused=true;document.getElementById('pause').textContent='继续';time+=1/30;draw()};function draw(){rig.update(time,Number(speed.value));rig.getFootContacts().forEach((foot,i)=>{dots[i].visible=debug.checked;dots[i].position.set(foot.x,foot.contactY,.1)});renderer.render(scene,camera)}function tick(now){const dt=last?Math.min(.04,(now-last)/1000):0;last=now;if(!paused)time+=dt*Number(speed.value);draw();requestAnimationFrame(tick)}requestAnimationFrame(tick);window.rigPreview={rig,renderer,scene,camera,pose:function(t){time=t;paused=true;draw()}};})();
