<script>
(function(){
'use strict';
var world=document.getElementById('world'),invite=document.getElementById('invitation'),completion=document.getElementById('completion'),arc=invite.querySelector('.progress'),status=document.getElementById('status'),replay=document.getElementById('replay'),stepOut=document.getElementById('step-out'),finalActions=document.getElementById('final-actions');
var scene=window.heroScene=new CihouHeroSceneV4(world,{roadTextureUrl:'paper-road-v1.png',markerUrl:'flower-stone-v1.png'}),reduced=scene.reducedMotion,progress=0,holding=false,last=0,revealFinished=false,settleAt=0,rewindStart=0,rewindFrom=0,exitStarted=0,exited=false;
CihouCharacterRig.create({atlasUrl:'girl-rig-parts-v4.png',metadata:JSON.parse(document.getElementById('rig-meta').textContent),height:.8}).then(function(rig){scene.setRig(rig);window.heroRig=rig;});
var query=new URLSearchParams(location.search);if(query.has('progress')){progress=Math.max(0,Math.min(1,Number(query.get('progress'))));scene.progress=scene.targetProgress=progress;scene.render();}if(query.get('paused')==='1')scene.setPaused(true);
function announce(text){status.textContent=text;}
function start(event){if(event&&event.button!==undefined&&event.button!==0)return;if(revealFinished||rewindStart)return;if(reduced){progress=1;scene.setProgress(1);holding=false;finish();return;}holding=true;scene.setInteraction(1);invite.classList.add('held','visible');if(event&&event.pointerId!==undefined)world.setPointerCapture(event.pointerId);}
function stop(){holding=false;scene.setInteraction(0);invite.classList.remove('held');if(progress>0&&!revealFinished)document.getElementById('instruction').textContent='继续按住';}
function finish(){if(revealFinished)return;revealFinished=true;holding=false;scene.setInteraction(0);invite.classList.remove('visible','held');settleAt=performance.now()+1500;announce('可以再往前一步，或直接阅读正文。');}
world.addEventListener('pointerdown',start);world.addEventListener('pointerup',stop);world.addEventListener('pointercancel',stop);world.addEventListener('lostpointercapture',stop);world.addEventListener('contextmenu',function(event){event.preventDefault()});
world.addEventListener('keydown',function(event){if((event.code==='Space'||event.code==='Enter')&&!event.repeat){event.preventDefault();start();}});world.addEventListener('keyup',function(event){if(event.code==='Space'||event.code==='Enter'){event.preventDefault();stop();}});window.addEventListener('blur',stop);
if(reduced)document.getElementById('instruction').textContent='点击，看远一点';
setTimeout(function(){if(!revealFinished&&!rewindStart)invite.classList.add('visible')},1800);
stepOut.addEventListener('click',function(){completion.classList.remove('visible');exitStarted=performance.now();scene.setInteraction(.6);});
replay.addEventListener('click',function(){completion.classList.remove('visible');finalActions.hidden=true;stepOut.hidden=false;settleAt=0;revealFinished=false;rewindFrom=progress;rewindStart=performance.now();exitStarted=0;exited=false;scene.setExit(0);stop();announce('重新回到路上。');});
document.addEventListener('visibilitychange',function(){stop();scene.setActive(!document.hidden)});
if('IntersectionObserver'in window)new IntersectionObserver(function(entries){scene.setActive(entries[0].isIntersecting&&!document.hidden);if(!entries[0].isIntersecting)stop();},{threshold:.02}).observe(world);
window.addEventListener('pagehide',function(){scene.setActive(false);stop()});window.addEventListener('pageshow',function(){scene.setActive(true)});
function tick(now){var dt=last?Math.min(.05,(now-last)/1000):0;last=now;if(holding&&!revealFinished){progress=Math.min(1,progress+dt/6.5);scene.setProgress(progress);if(progress===1)finish();}if(exitStarted){var ex=reduced?1:Math.min(1,(now-exitStarted)/3000);scene.setExit(ex);if(ex===1){exitStarted=0;exited=true;scene.setInteraction(0);setTimeout(function(){stepOut.hidden=true;finalActions.hidden=false;completion.classList.add('visible');announce('已走出环面。可以继续阅读或重新观看。')},450)}}if(rewindStart){var t=reduced?1:Math.min(1,(now-rewindStart)/1900);progress=rewindFrom*(1-t*t*(3-2*t));scene.setProgress(progress);if(t===1){rewindStart=0;document.getElementById('instruction').textContent=reduced?'点击，看远一点':'按住，随她往前';invite.classList.add('visible');world.focus({preventScroll:true})}}arc.style.strokeDashoffset=String(62.83*(1-progress));if(settleAt&&now>=settleAt){settleAt=0;completion.classList.add('visible')}requestAnimationFrame(tick)}requestAnimationFrame(tick);
if(progress===1)finish();
})();
</script>
