function sync(snapshot){if(!scene)return;snapshot=snapshot&&snapshot.phase?snapshot:scene.getState();var exit=['placing','crossing','leaving'].indexOf(snapshot.phase)>=0;completion.classList.toggle('visible',snapshot.canExit||snapshot.exitComplete);stepOut.hidden=!snapshot.canExit;finalActions.hidden=!snapshot.exitComplete;invite.classList.toggle('visible',!snapshot.canExit&&!snapshot.exitComplete);instruction.textContent=reduced?(exit?'点击，往前走':'点击，看见更多'):(exit?'按住，往前走':'按住，陪她走');arc.style.strokeDashoffset=String(62.83*(1-(exit?snapshot.exitProgress:snapshot.holdProgress)));world.dataset.storyProgress=String(snapshot.holdProgress);world.dataset.exitProgress=String(snapshot.exitProgress);}
function start(event){if(event&&event.button!==undefined&&event.button!==0)return;if(paused)return;var state=scene.getState();if(state.canExit||state.exitComplete)return;if(reduced){if(['placing','crossing','leaving'].indexOf(state.phase)>=0)scene.setExit(1);else scene.setProgress(1);sync();return;}holding=true;scene.setInteraction(1);invite.classList.add('held');if(event&&event.pointerId!==undefined)world.setPointerCapture(event.pointerId);}
function stop(){holding=false;scene.setInteraction(0);invite.classList.remove('held');sync();}
world.addEventListener('pointerdown',start);world.addEventListener('pointerup',stop);world.addEventListener('pointercancel',stop);world.addEventListener('lostpointercapture',stop);world.addEventListener('contextmenu',function(event){event.preventDefault();});world.addEventListener('keydown',function(event){if((event.code==='Space'||event.code==='Enter')&&!event.repeat){event.preventDefault();start();}});world.addEventListener('keyup',function(event){if(event.code==='Space'||event.code==='Enter'){event.preventDefault();stop();}});
