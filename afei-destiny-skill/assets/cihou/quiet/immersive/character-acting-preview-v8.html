<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>V8 角色表演检查</title><style>
*{box-sizing:border-box}body{margin:0;background:#f1eade;color:#405879;font:13px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}#stage{height:76svh;min-height:430px}canvas{display:block;width:100%;height:100%}.controls{max-width:900px;margin:0 auto;padding:12px 24px 24px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}button{font:inherit;color:inherit;background:none;border:1px solid #c4c4b9;padding:7px 12px;cursor:pointer}button[aria-pressed=true]{background:#405879;color:#f1eade}label{display:flex;gap:9px;align-items:center}output{min-width:100px}.note{font-size:11px;opacity:.65;width:100%;margin:0}input{accent-color:#405879}
</style></head><body><div id="stage" aria-label="人物表演预览"></div><div class="controls">
<button data-pose="walk" aria-pressed="true">行走</button><button data-pose="look">看花</button><button data-pose="crouch">下沉</button><button data-pose="reach">伸手</button><button data-pose="carry">收包</button><button data-pose="drop">落种</button><button data-pose="glance">回望</button><button data-pose="sequence">连续演出</button><button id="pause">暂停</button><label><input id="debug" type="checkbox" checked>关节与鞋底</label><label>时间<input id="seek" type="range" min="0" max="8" step=".01" value="0"></label><output id="status">行走</output><p class="note">独立表演检查页。浅金点=手端，蓝点=包口，脚边小阴影随真实鞋底接触改变；背景与花标仅供动作对位。</p></div>
<script src="three.min.js"></script><script src="hero-character-rig-v8.js"></script><script>
(async function(){'use strict';var T=THREE,stage=document.getElementById('stage'),renderer=new T.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setClearColor('#f1eade',1);renderer.outputColorSpace=T.SRGBColorSpace;stage.appendChild(renderer.domElement);var scene=new T.Scene(),camera=new T.OrthographicCamera(-1,1,.6,-.6,.01,20);camera.position.set(0,.4,5);camera.lookAt(0,.4,0);var params=new URLSearchParams(location.search),atlas=params.get('atlas')||'girl-rig-parts-v5.png',metadataUrl=params.get('metadata')||'girl-rig-parts-v5.json',meta=await fetch(metadataUrl).then(function(r){return r.json();});var rig=await CihouCharacterRigV8.create({atlasUrl:atlas,metadata:meta,height:.8});scene.add(rig.group);
var road=new T.Mesh(new T.PlaneGeometry(4,.52),new T.MeshBasicMaterial({color:'#405879'}));road.position.set(0,-.14,-.02);scene.add(road);var floor=new T.Line(new T.BufferGeometry().setFromPoints([new T.Vector3(-1.5,0,.001),new T.Vector3(1.5,0,.001)]),new T.LineBasicMaterial({color:'#b9bcad'}));scene.add(floor);
function dot(r,color){var mesh=new T.Mesh(new T.CircleGeometry(r,24),new T.MeshBasicMaterial({color:color,transparent:true}));mesh.position.z=.12;scene.add(mesh);return mesh;}var handDot=dot(.009,'#e7bd69'),bagDot=dot(.007,'#5e8f9b'),flower=dot(.013,'#e7bd69'),seed=dot(.007,'#d9b15b'),footDots=[dot(.013,'#1f334e'),dot(.013,'#1f334e')];var flowerAt=new T.Vector3(.8*.25,.8*.64,.11);flower.position.copy(flowerAt);var stem=new T.Line(new T.BufferGeometry().setFromPoints([new T.Vector3(flowerAt.x,.03,.02),flowerAt.clone()]),new T.LineBasicMaterial({color:'#919873'}));scene.add(stem);
var paused=false,mode='walk',time=0,gait=0,last=0,seek=document.getElementById('seek'),status=document.getElementById('status'),debug=document.getElementById('debug');var clamp=function(x){return Math.max(0,Math.min(1,x));},smooth=function(x){x=clamp(x);return x*x*(3-2*x);};
function pose(age){var event={lockFeet:1},speed=0,flow=mode==='sequence'?age:({look:.5,crouch:1.2,reach:1.98,carry:2.8,drop:5.1,glance:7.1}[mode]||0);if(mode==='walk')return{event:{},speed:1};event.look=smooth(flow/.65)*(1-smooth((flow-3.0)/.5));event.crouch=smooth((flow-.65)/.60)*(1-smooth((flow-2.05)/.95));event.reach=smooth((flow-1.25)/.70)*(1-smooth((flow-2.05)/.95));event.carry=smooth((flow-2.05)/.7)*(1-smooth((flow-3.1)/.4));var from=flowerAt.clone(),bag=rig.getAttachment('bag'),carry=smooth((flow-2.05)/.75);from.lerp(bag,carry);event.handTarget=[from.x,from.y];event.lookTarget=[flowerAt.x,flowerAt.y];event.nod=Math.sin(Math.PI*clamp((flow-3)/.5));if(flow>3.5&&flow<4.4){event={};speed=1;}if(flow>=4.4&&flow<6.5){event={lockFeet:1,drop:smooth((flow-4.4)/.6)*(1-smooth((flow-5.65)/.7)),look:smooth((flow-4.4)/.4),crouch:smooth((flow-4.6)/.5)*.3,lookTarget:[.28,0]};}if(flow>=6.5){event={lookBack:Math.sin(Math.PI*clamp((flow-6.5)/1.3)),lookTarget:[-.20,.02]};speed=1;}return{event:event,speed:speed,flow:flow};}
function draw(){var current=pose(time);rig.update(current.speed?gait:0,current.speed,current.event);var hand=rig.getAttachment('hand'),bag=rig.getAttachment('bag');handDot.position.copy(hand);bagDot.position.copy(bag);handDot.visible=bagDot.visible=debug.checked;flower.visible=mode==='walk'||(current.flow||0)<2.0;stem.visible=flower.visible;if(!flower.visible&&current.flow<3.1){flower.visible=true;flower.position.copy(hand);}else flower.position.copy(flowerAt);seed.visible=(current.flow||0)>4.7&&(current.flow||0)<6.4;if(seed.visible){var f=smooth(((current.flow||0)-5.05)/.6),land=new T.Vector3(.28,.006,.12);seed.position.copy(hand.clone().lerp(land,f));seed.position.y+=Math.sin(Math.PI*f)*.025;}rig.getFootContacts().forEach(function(foot,i){var dot=footDots[i];dot.visible=debug.checked;dot.position.set(foot.x,foot.y-.002,.08);dot.scale.set(1+foot.stance*.3,.28,.1);dot.material.opacity=.20+.5*foot.stance;});renderer.render(scene,camera);status.textContent=mode+' '+time.toFixed(2)+'s';seek.value=String(time);}
function resize(){var w=stage.clientWidth,h=stage.clientHeight;renderer.setSize(w,h,false);var span=1.75;camera.left=-span*.5*w/h;camera.right=span*.5*w/h;camera.top=span*.5;camera.bottom=-span*.5;camera.updateProjectionMatrix();draw();}new ResizeObserver(resize).observe(stage);document.querySelectorAll('[data-pose]').forEach(function(b){b.onclick=function(){mode=b.dataset.pose;time=0;gait=0;paused=mode!=='walk'&&mode!=='sequence';document.getElementById('pause').textContent=paused?'继续':'暂停';document.querySelectorAll('[data-pose]').forEach(function(x){x.setAttribute('aria-pressed',String(x===b));});draw();};});document.getElementById('pause').onclick=function(){paused=!paused;this.textContent=paused?'继续':'暂停';};seek.oninput=function(){time=Number(this.value);mode='sequence';paused=true;document.getElementById('pause').textContent='继续';draw();};debug.onchange=draw;resize();function tick(now){var dt=last?Math.min(.05,(now-last)/1000):0;last=now;if(!paused){time+=dt;gait+=dt;if(time>8&&mode==='sequence')time=0;}draw();requestAnimationFrame(tick);}requestAnimationFrame(tick);
})();</script></body></html>
